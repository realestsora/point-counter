<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222228"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="card" x1="28" y1="30" x2="100" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BE7FF"/>
      <stop offset="0.45" stop-color="#5ED4FF"/>
      <stop offset="1" stop-color="#2AA8D8"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" y1="28" x2="40" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" stroke="#fff" stroke-opacity=".08"/>

  <rect x="22" y="78" width="28" height="10" rx="5" fill="#FF5A5F"/>
  <rect x="22" y="94" width="28" height="10" rx="5" fill="#3DDC84"/>
  <rect x="54" y="86" width="20" height="10" rx="5" fill="#C77DFF" opacity=".9"/>
  <rect x="78" y="86" width="28" height="10" rx="5" fill="#FF9F1A" opacity=".9"/>

  <g filter="url(#glow)">
    <rect x="18" y="22" width="92" height="50" rx="16" fill="url(#card)"/>
    <rect x="18" y="22" width="92" height="26" rx="16" fill="url(#shine)"/>

    <circle cx="36" cy="47" r="10" fill="#fff"/>
    <path d="M31 47h10" stroke="#16161a" stroke-width="2.6" stroke-linecap="round"/>

    <text
      x="64"
      y="47"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="system-ui,Segoe UI,sans-serif"
      font-size="24"
      font-weight="800"
      fill="#fff"
    >12</text>

    <circle cx="92" cy="47" r="10" fill="#fff"/>
    <path d="M87 47h10M92 42v10" stroke="#16161a" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
